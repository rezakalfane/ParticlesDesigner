# Publishes the embed kit to npm (@absolumont/particles-designer) when a version tag
# is pushed (npm version patch && git push --follow-tags), then creates the GitHub
# Release (scripts/github-release.sh). jsDelivr and unpkg serve the npm package. A macOS
# job then builds the desktop app (universal, ad-hoc signed) and attaches the .dmg.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. Configure it once
# on npmjs.com → the package → Settings → Trusted publishing → GitHub Actions:
#   owner rezakalfane, repository ParticlesDesigner, workflow publish.yml.
# Releases published this way carry a provenance attestation linking them to this commit.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for "changes since the previous tag"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - run: npm ci
      # prepublishOnly runs `npm run verify` (format, types, tests, app + kit builds).
      # Re-runs skip the publish when this version is already on npm.
      - name: npm publish
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish."
          else
            npm publish
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/github-release.sh "${GITHUB_REF_NAME}"

  mac-app:
    needs: publish # the GitHub Release must exist before the .dmg is attached
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ad-hoc signed (mac.identity "-"): no Apple Developer certificate is involved.
      - run: npm run dist:mac
      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/*.dmg --clobber
