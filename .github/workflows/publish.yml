# Publishes the embed kit to npm (@absolumont/particles-designer) when a version tag
# is pushed (git tag v0.1.1 && git push --tags). jsDelivr and unpkg serve it from there.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. Configure it once
# on npmjs.com → the package → Settings → Trusted publishing → GitHub Actions:
#   owner rezakalfane, repository ParticlesDesigner, workflow publish.yml.
# Releases published this way carry a provenance attestation linking them to this commit.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - run: npm ci
      # prepublishOnly runs `npm run verify` (format, types, tests, app + kit builds).
      - run: npm publish
